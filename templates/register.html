{% extends "base.html" %}{% block title %}Create account{% endblock %}{% block content %}
<div class="narrow"><div class="eyebrow">JOIN CERTICHAIN</div><h1>Create your account</h1><p class="muted">Choose the account type that matches how you will use the system.</p>
<form class="form-card" method="post"><div class="form-grid"><label>Full name<input name="name" required maxlength="120" autocomplete="name"></label><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" minlength="8" required autocomplete="new-password"><small>At least 8 characters.</small></label><label>Account type<select name="role" id="role" required><option value="student">Student</option><option value="institution">Institution</option><option value="verifier">Employer / Verifier</option></select></label><label id="org-wrap" class="full">Institution / organization name<input name="organization" maxlength="180" placeholder="Required for institution accounts"></label></div><button class="button primary full">Create account</button><p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></form></div>
<script>const role=document.getElementById('role'),wrap=document.getElementById('org-wrap');function sync(){wrap.style.display=role.value==='institution'?'grid':'none'}role.addEventListener('change',sync);sync();</script>{% endblock %}
