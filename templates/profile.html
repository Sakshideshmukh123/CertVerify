{% extends "base.html" %}{% block title %}My profile{% endblock %}{% block content %}
<div class="narrow"><div class="eyebrow">ACCOUNT SETTINGS</div><h1>My profile</h1><p class="muted">Review and update your profile information.</p><form class="form-card" method="post"><div class="profile-summary"><div class="avatar">{{ profile.name[:1]|upper }}</div><div><b>{{ profile.name }}</b><p class="muted">{{ profile.email }}</p><span class="status valid">{{ profile.role }}</span></div></div><label>Full name<input name="name" value="{{ profile.name }}" required maxlength="120"></label><label>Email address<input value="{{ profile.email }}" disabled><small>Email changes are disabled in this demo.</small></label><label>Account type<input value="{{ profile.role }}" disabled></label><label>Organization<input name="organization" value="{{ profile.organization or '' }}" maxlength="180"></label><label>Created at<input value="{{ profile.created_at }}" disabled></label><button class="button primary full">Save profile</button></form></div>{% endblock %}
